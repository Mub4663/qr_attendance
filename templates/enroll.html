{% extends 'base.html' %}
{% block title %}Enroll in Course{% endblock %}

{% block content %}
<div class="auth-wrapper centered">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">📚</div>
      <h1>Enroll in Course</h1>
      <p>Enter the course code given by your lecturer.</p>
    </div>
    <form method="POST" action="{{ url_for('student.enroll') }}" class="auth-form">
      <div class="form-group">
        <label>Course Code</label>
        <input type="text" name="course_code" placeholder="e.g. CSC4301" class="mono" required>
      </div>
      <button type="submit" class="btn-primary full-width">Enroll</button>
    </form>
    <p class="auth-footer">
      <a href="{{ url_for('student.dashboard') }}">← Back to Dashboard</a>
    </p>
  </div>
</div>
{% endblock %}
