{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-wrapper centered">
  <div class="auth-card wide">
    <div class="auth-brand">
      <div class="brand-icon">◈</div>
      <h1>Create Account</h1>
      <p>Student Registration — ADUSTECH</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">

      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" placeholder="Yahaya Ibrahim" required>
        </div>
        <div class="form-group">
          <label>Registration Number</label>
          <input type="text" name="reg_no" placeholder="UG18/COMS/1114" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="student@adustech.edu.ng" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Department</label>
          <select name="department" required>
            <option value="">-- Select --</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Software Engineering">Software Engineering</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Cyber Security">Cyber Security</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
          </select>
        </div>
        <div class="form-group">
          <label>Level</label>
          <select name="level" required>
            <option value="">-- Select --</option>
            <option value="100">100 Level</option>
            <option value="200">200 Level</option>
            <option value="300">300 Level</option>
            <option value="400">400 Level</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min. 6 characters" required minlength="6">
      </div>

      <button type="submit" class="btn-primary full-width">Register</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
